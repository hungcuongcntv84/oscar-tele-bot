name: Oscar Weekly Recognition nominations
on:
  schedule:
    - cron: '0 15 * * 0'
    - cron: '30 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oscar-weekly-recognition
  cancel-in-progress: false
jobs:
  nominate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Deliver private nominations (Sunday 22:00 GMT+7)
        run: python -c "import os; from weekly_award import make_nomination, publish_award; t=os.getenv('AWARD_TRIGGER'); print(make_nomination(scheduled=True) if t=='0 15 * * 0' else publish_award() if t=='30 4 * * 1' else make_nomination(force=True))"
        env:
          AWARD_TRIGGER: ${{ github.event.schedule }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEAM_REPORT_CHAT_ID: ${{ secrets.TEAM_REPORT_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
